[project]
name = "embly"
version = "0.1.0"
description = "Watch-folder daemon that auto-organizes files with OCR + laya"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "laya>=0.3.20",
    "typer>=0.12",
    "rich>=13",
    "pymupdf>=1.24",
    "pillow>=10",
    "pillow-heif>=0.13",
    "charset-normalizer>=3",
    "numpy>=1.26",
    "unidecode>=1.3",
    "tomli-w>=1.0",
    "paddleocr>=3.7",
    "paddlepaddle>=3.0",
]

[project.optional-dependencies]
office = ["markitdown>=0.1"]
media = ["faster-whisper>=1.0"]
llm = ["ollama>=0.4"]

[project.scripts]
embly = "embly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embly"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
